#   id: ID!
#   blockHeight: BigInt!
#   timestamp: String!
# }

type Transfers @entity {
  id: ID!
  blockHeight: BigInt @index
  txHash: Bytes
  fromAddress: Bytes @index
  toAddress: Bytes @index
  amount: String @index
}

type BlockData @entity {
  id: ID!
  hash: Bytes!
  height: Float!
  proposer: Bytes!
  totalBlobSize: Float!
  totalSquareSize: Float!

  totalEventsCount: Float!

  totalBlobTransactionCount: Float!

  totalTransactionCount: Float!

  avgNativePrice: Float!
  currentNativePrice: Float!
  totalBlockFeeNatve: Float!
  totalBlockFeeUSD: Float!
  totalDAFeeNatve: Float!
  totalDAFeeUSD: Float!

  timestamp: Float
  transactions: [TransactionData] @derivedFrom(field: "blockHeight")
  blobs: [BlobData] @derivedFrom(field: "blockHeight")
}
type BlobData @entity {
  id: ID!
  namespaceID: Bytes @index
  data: Bytes
  shareVersion: String
  namespaceVersion: String
  transaction: TransactionData
  commitment: Bytes
  size: Float @index
  signer: AccountEntity
  blockHeight: BlockData @index
}

type TransactionData @entity {
  id: ID!
  hash: Bytes!
  blockHeight: BlockData @index
  timestamp: Float! @index

  signer: AccountEntity

  amount: Float!

  lastPriceFeed: PriceFeedMinute @index

  txFeeNative: Float!
  nMessages: Float!
  nEvents: Float!
  nDataSubs: Float!
  totalBytes: Float!

  totalFeeNatve: Float! @index
  totalFeeUSD: Float!
  totalDAFeeNatve: Float! @index
  totalDAFeeUSD: Float!

  isBlobTransaction: Boolean!
  blobs: [BlobData] @derivedFrom(field: "transaction") @index
}

type Block @entity {
  id: ID!
  height: Float! @index
  hash: Bytes!
  timestamp: Date! @index
  proposer: Bytes @index
  nTransactions: Int
  nEvents: Int
  nBlobs: Int @index
  blobSize: Int @index
  totalFeesNative: Float @index
  totalFeesUSD: Float
  version: Bytes
  nativePrice: Float!
}

type PriceFeedMinute @entity {
  id: ID!
  date: Date @index
  nativePrice: Float!
  nativeBlock: Int!
  nativeDate: Date @index
}

type AccountEntity @entity {
  id: ID!
  type: Float
  createdAt: Date!
  updatedAt: Date! @index
  address: Bytes! @index
  totalByteSize: Float! @index
  totalFees: Float
  totalDAFees: Float @index
  totalDAFeesUSD: Float
  totalFeesUSD: Float
  totalFeesNative: Float
  totalDataSubmissionCount: Float @index
  totalTransferCount: Float
  totalTxnCount: Float! @index
  totalBlocksCount: Float
  totalDataBlocksCount: Float
  lastPriceFeed: PriceFeedMinute
  avgNativePrice: Float
  accountDayData: [AccountDayData] @derivedFrom(field: "account")
  accountHourData: [AccountHourData] @derivedFrom(field: "account")
  startBlock: Float
  endBlock: Float @index
  transactions: [TransactionData] @derivedFrom(field: "signer")
  blobs: [BlobData] @derivedFrom(field: "signer")
}
type AccountDayData @entity {
  id: ID!
  totalByteSize: Float! @index
  totalFees: Float
  totalDAFees: Float @index
  totalDAFeesUSD: Float
  totalFeesUSD: Float
  totalFeesNative: Float
  totalDataSubmissionCount: Float @index
  totalTransferCount: Float
  totalTxnCount: Float
  totalBlocksCount: Float
  totalDataBlocksCount: Float
  totalDataAccountsCount: Float
  lastPriceFeed: PriceFeedMinute
  timestampLast: Date!
  timestampStart: Date!
  startBlock: Float
  endBlock: Float @index
  avgNativePrice: Float
  prevDayData: AccountDayData
  account: AccountEntity!
  collectiveDayData: CollectiveDayData
}
type AccountHourData @entity {
  id: ID!
  type: Float
  totalByteSize: Float! @index
  totalFees: Float
  totalDAFees: Float @index
  totalDAFeesUSD: Float
  totalFeesUSD: Float
  totalFeesNative: Float
  totalDataSubmissionCount: Float @index
  totalTransferCount: Float
  totalTxnCount: Float
  totalBlocksCount: Float
  totalDataBlocksCount: Float
  totalDataAccountsCount: Float
  lastPriceFeed: PriceFeedMinute
  timestampLast: Date! @index
  timestampStart: Date!
  startBlock: Float
  endBlock: Float @index
  avgNativePrice: Float
  prevHourData: AccountHourData
  account: AccountEntity!
  collectiveHourData: CollectiveHourData
}

type CollectiveData @entity {
  id: ID!
  totalByteSize: Float! @index
  totalFees: Float
  totalDAFees: Float @index
  totalDAFeesUSD: Float @index
  totalFeesUSD: Float
  totalFeesNative: Float @index
  totalDataSubmissionCount: Float
  totalTransferCount: Float
  totalTxnCount: Float
  totalBlocksCount: Float
  totalDataBlocksCount: Float
  totalDataAccountsCount: Float
  lastPriceFeed: PriceFeedMinute @index
  timestampLast: Date! @index
  avgNativePrice: Float

  endBlock: Float @index
  collectiveDayData: [CollectiveDayData] @derivedFrom(field: "collectiveData")
  collectiveHourData: [CollectiveHourData] @derivedFrom(field: "collectiveData")
  lastUpdatedTxnId: Bytes!
}
type CollectiveDayData @entity {
  id: ID!
  totalByteSize: Float! @index
  totalFees: Float
  totalDAFees: Float @index
  totalDAFeesUSD: Float
  totalFeesUSD: Float
  totalFeesNative: Float @index
  totalDataSubmissionCount: Float @index
  totalTransferCount: Float
  totalTxnCount: Float
  totalBlocksCount: Float
  totalDataBlocksCount: Float
  totalDataAccountsCount: Float
  lastPriceFeed: PriceFeedMinute
  timestampLast: Date! @index
  timestampStart: Date! 
  startBlock: Float 
  endBlock: Float @index
  avgNativePrice: Float

  prevDayData: CollectiveDayData

  accountDayDataParticipant: [AccountDayData]
    @derivedFrom(field: "collectiveDayData")

  collectiveData: CollectiveData
  lastUpdatedTxnId: Bytes!
}
type CollectiveHourData @entity {
  id: ID!
  totalByteSize: Float! @index
  totalFees: Float
  totalDAFees: Float @index
  totalDAFeesUSD: Float @index
  totalFeesUSD: Float
  totalFeesNative: Float @index
  totalDataSubmissionCount: Float @index
  totalTransferCount: Float
  totalTxnCount: Float
  totalBlocksCount: Float
  totalDataBlocksCount: Float
  totalDataAccountsCount: Float
  lastPriceFeed: PriceFeedMinute
  timestampStart: Date!
  timestampLast: Date! @index
  startBlock: Float
  endBlock: Float @index
  avgNativePrice: Float

  prevHourData: CollectiveHourData

  accountHourDataParticipant: [AccountHourData]
    @derivedFrom(field: "collectiveHourData")
  collectiveData: CollectiveData
  lastUpdatedTxnId: Bytes! @index
}
