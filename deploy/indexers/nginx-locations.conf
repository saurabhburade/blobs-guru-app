# Include inside the existing HTTPS server for ethapi.blobs.guru.
# The legacy / route remains on Ethereum for existing clients.
location = /ethereum {
    limit_req zone=ethapi_limit burst=100 nodelay;
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location ^~ /ethereum/ {
    limit_req zone=ethapi_limit burst=100 nodelay;
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
