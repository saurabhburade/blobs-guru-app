name: Ethereum SubQuery PR

on:
  pull_request:
    paths:
      - "apps/ethereum-subquery/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.subquery.json"
      - "turbo.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run codegen --filter=@blobs-guru/ethereum-subquery
      - run: pnpm exec turbo run test --filter=@blobs-guru/ethereum-subquery
