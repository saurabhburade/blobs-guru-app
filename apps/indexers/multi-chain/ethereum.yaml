# Restored from the indexer's development history with a public RPC endpoint.
specVersion: 1.0.0
version: 0.0.1
name: ethereum-blobs
description: Indexes Ethereum block data alongside Avail data.
runner:
  node:
    name: '@subql/node-ethereum'
    version: '>=3.0.0'
  query:
    name: '@subql/query'
    version: '*'
schema:
  file: ./schema.graphql
options:
  abi: Oracle
network:
  chainId: '1'
  endpoint:
    - https://ethereum.rpc.subquery.network/public
dataSources:
  - kind: ethereum/Runtime
    startBlock: 20229117
    assets:
      Oracle:
        file: ./abis/OneinchABI.abi.json
    mapping:
      file: ./dist/index.js
      handlers:
        - kind: ethereum/BlockHandler
          handler: handleEthBlock
